name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version

      # A fresh runner has an empty registry index, so dependencies
      # (moonbitlang/x, bobzhang/zip, ...) cannot be resolved until the index
      # is fetched.
      - name: Update registry index
        run: moon update

      - name: Check
        run: moon check

      - name: Test
        run: moon test

      # Built through the same script the release uses, so CI builds carry the
      # pinned baseline instruction set. A runner-built binary that needs AVX2
      # is exactly what shipped as 0.1.9 and died with SIGILL.
      # The static musl build is what ships for Linux, so CI tests that exact
      # artifact. It also makes the AVX2 gate meaningful: a static binary does
      # not load the host's glibc, which on newer images is itself built for
      # x86-64-v3 and would SIGILL under `qemu64` regardless of our code.
      - name: Build (static, release)
        run: ./scripts/build-native.sh --static dist/xmlfmt-static

      # Guards the bug that made 0.1.9 useless on pre-Haswell CPUs: the binary
      # must run on qemu's oldest x86_64 model. Emulation is fine here, the
      # failure mode is an illegal instruction rather than timing.
      - name: Verify the binary runs without AVX2
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          qemu-x86_64 -cpu qemu64 dist/xmlfmt-static --version
          printf '<a><b>1</b></a>' |
            qemu-x86_64 -cpu qemu64 dist/xmlfmt-static -c - | grep -qx '<a><b>1</b></a>' 

      # These cover the CLI itself: stdout/stderr split, exit codes and
      # argument handling, none of which `moon test` can reach.
      - name: CLI smoke tests
        run: ./scripts/cli-smoke.sh dist/xmlfmt-static

      # The npm wrapper decides which binary to run; a stale download after an
      # upgrade is a silent wrong-version bug, so its logic is tested too.
      # An explicit test file, not `npmjs/test/`: Node 22.23 and 24.22 on the
      # runners resolve a directory argument as a module and fail with
      # "Cannot find module '.../npmjs/test'".
      - name: npm wrapper tests
        run: node --test npmjs/test/lib.test.js
