name: release

# Builds `xmlfmt` for every supported target and attaches the binaries to a
# GitHub Release. The npm package in `npmjs/` downloads these assets.
#
#   git tag v0.1.10 && git push origin v0.1.10

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are linked fully statically against musl, so they
          # run on any distribution regardless of its glibc version. A glibc
          # build would pick up the runner's glibc symbol versions and refuse
          # to start on older systems (e.g. `GLIBC_2.33' not found`).
          # Pinned to 24.04 rather than `ubuntu-latest`: newer Ubuntu images
          # raise the compiler default to x86-64-v3 (AVX2), and their static
          # musl libc.a is built the same way. `-march=x86-64` in
          # scripts/build-native.sh keeps *our* code at the baseline, but only
          # an older image keeps libc.a itself baseline too; a v3 memcpy is
          # SIGILL on a pre-Haswell CPU just the same.
          - runner: ubuntu-24.04
            target: linux-x86_64
            musl: true
          # GitHub's arm64 Linux runners are only available to public
          # repositories; drop this entry (and the MB target support for it)
          # if that is a problem.
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            musl: true
          - runner: macos-15
            target: darwin-aarch64
            musl: false
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install musl toolchain (static Linux builds)
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # The build script pins the baseline instruction set and wraps the
      # compiler: distributing a binary that needs AVX2 is what makes it die
      # with SIGILL on older CPUs.
      - name: Build (release)
        run: |
          if [ "${{ matrix.musl }}" = "true" ]; then
            ./scripts/build-native.sh --static "dist/xmlfmt-${{ matrix.target }}"
          else
            ./scripts/build-native.sh "dist/xmlfmt-${{ matrix.target }}"
          fi

      - name: Stage binary
        run: |
          mkdir -p dist
          file "dist/xmlfmt-${{ matrix.target }}" || true
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "xmlfmt-${{ matrix.target }}" > "xmlfmt-${{ matrix.target }}.sha256")
          else
            (cd dist && shasum -a 256 "xmlfmt-${{ matrix.target }}" > "xmlfmt-${{ matrix.target }}.sha256")
          fi

      # The binary must know which release it belongs to: tagging a commit
      # whose version was not bumped (or publishing npm before tagging) is how
      # users end up running one version while npm says another.
      - name: Verify binary reports the tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$("dist/xmlfmt-${{ matrix.target }}" --version)
          echo "binary reports: $got (tag $GITHUB_REF_NAME)"
          if [ "$got" != "xmlfmt $want" ]; then
            echo "error: binary reports '$got', expected 'xmlfmt $want'" >&2
            exit 1
          fi

      # Sanity check: Linux assets must be fully static or they would carry a
      # glibc version requirement and fail on older distributions.
      - name: Verify Linux binary is statically linked
        if: matrix.musl
        run: |
          file "dist/xmlfmt-${{ matrix.target }}"
          if ! file "dist/xmlfmt-${{ matrix.target }}" | grep -q "statically linked"; then
            echo "error: xmlfmt-${{ matrix.target }} is not statically linked" >&2
            exit 1
          fi

      # The x86_64 artifact must run on a CPU without AVX2, which is what the
      # 0.1.9 release failed to do (SIGILL on the user's machine). qemu's
      # `qemu64` model is the oldest thing we can test against; emulation is
      # enough because the failure is an illegal instruction, not timing.
      # This also covers libc.a: on a v3 image the static musl copy is v3 too,
      # and `-march` alone cannot fix that — hence the 24.04 runner pin.
      - name: Verify the binary runs without AVX2
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          qemu-x86_64 -cpu qemu64 "dist/xmlfmt-${{ matrix.target }}" --version
          printf '<a><b>1</b></a>' |
            qemu-x86_64 -cpu qemu64 "dist/xmlfmt-${{ matrix.target }}" -c - |
            grep -qx '<a><b>1</b></a>'

      - uses: actions/upload-artifact@v4
        with:
          name: xmlfmt-${{ matrix.target }}
          path: |
            dist/xmlfmt-${{ matrix.target }}
            dist/xmlfmt-${{ matrix.target }}.sha256
          if-no-files-found: error

  # A second Linux build linked against glibc. The musl build is the portable
  # default, but on some hosts it dies before `main` (hardened kernels, seccomp
  # filters), so the npm wrapper prefers this one where glibc is what the
  # machine uses.
  build-linux-gnu:
    name: build ${{ matrix.target }}-gnu
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same reason as the musl build: 24.04 keeps the C library it links
          # against at the x86-64 baseline.
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version

      - name: Update registry index
        run: moon update

      - name: Build (release, glibc)
        run: ./scripts/build-native.sh "dist/xmlfmt-${{ matrix.target }}-gnu"

      - name: Stage binary
        run: |
          mkdir -p dist
          file "dist/xmlfmt-${{ matrix.target }}-gnu"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "xmlfmt-${{ matrix.target }}-gnu" > "xmlfmt-${{ matrix.target }}-gnu.sha256")
          else
            (cd dist && shasum -a 256 "xmlfmt-${{ matrix.target }}-gnu" > "xmlfmt-${{ matrix.target }}-gnu.sha256")
          fi

      # The binary this build is meant to fix: if it cannot even print its
      # version on a stock runner, do not publish it.
      - name: Verify binary reports the tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$("dist/xmlfmt-${{ matrix.target }}-gnu" --version)
          echo "binary reports: $got (tag $GITHUB_REF_NAME)"
          if [ "$got" != "xmlfmt $want" ]; then
            echo "error: binary reports '$got', expected 'xmlfmt $want'" >&2
            exit 1
          fi
          printf '<a><b>1</b></a>' | "dist/xmlfmt-${{ matrix.target }}-gnu" -c - | grep -qx '<a><b>1</b></a>'

      - uses: actions/upload-artifact@v4
        with:
          name: xmlfmt-${{ matrix.target }}-gnu
          path: |
            dist/xmlfmt-${{ matrix.target }}-gnu
            dist/xmlfmt-${{ matrix.target }}-gnu.sha256
          if-no-files-found: error

  build-darwin-x64:
    name: build darwin-x64 (zig-cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: moon version
        run: moon version

      # A fresh runner has an empty registry index, so dependencies
      # (moonbitlang/x, ...) cannot be resolved until the index is fetched.
      - name: Prepare macOS headers shim for zig
        run: |
          rm -rf /tmp/macos-headers
          mkdir -p /tmp/macos-headers/sys
          cat > /tmp/macos-headers/sys/vnode.h <<'EOF'
          #ifndef _SYS_VNODE_H
          #define _SYS_VNODE_H
          enum vtype { VNON, VREG, VDIR, VBLK, VCHR, VLNK, VSOCK, VFIFO, VBAD, VSTR, VCPLX };
          #endif
          EOF

      - name: Update registry index
        run: moon update

      - name: Build (darwin-x64, via zig-cross)
        env:
          C_INCLUDE_PATH: /tmp/macos-headers
        run: |
          moonx moonrockz/zig-cross@0.1.2 build darwin-x64

      - name: Stage binary
        run: |
          mkdir -p dist
          cp _build/cross/darwin-x64/native/release/build/cmd/xmlfmt/xmlfmt.exe "dist/xmlfmt-darwin-x86_64"
          chmod +x "dist/xmlfmt-darwin-x86_64"
          file "dist/xmlfmt-darwin-x86_64" || true
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "xmlfmt-darwin-x86_64" > "xmlfmt-darwin-x86_64.sha256")
          else
            (cd dist && shasum -a 256 "xmlfmt-darwin-x86_64" > "xmlfmt-darwin-x86_64.sha256")
          fi

      # This binary cannot be executed here (cross-compiled), so compare the
      # version it was built from instead.
      - name: Verify built version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(sed -n 's/^version = "\(.*\)"$/\1/p' moon.mod)
          npm=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' npmjs/package.json)
          echo "tag $want, moon.mod $got, npmjs/package.json $npm"
          if [ "$got" != "$want" ] || [ "$npm" != "$want" ]; then
            echo "error: tag, moon.mod and npmjs/package.json disagree" >&2
            exit 1
          fi

      - name: Verify macOS x64 binary header
        run: |
          python3 - "dist/xmlfmt-darwin-x86_64" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()[:16]
          if data[:4] != b"\xcf\xfa\xed\xfe":
              raise SystemExit(f"expected Mach-O magic, found {data[:4]!r}")
          (cputype,) = struct.unpack_from("<I", data, 4)
          if cputype != 16777223:
              raise SystemExit(f"expected Mach-O cputype 16777223, found {cputype}")
          print(f"OK darwin-x64: Mach-O cputype {cputype}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xmlfmt-darwin-x86_64
          path: |
            dist/xmlfmt-darwin-x86_64
            dist/xmlfmt-darwin-x86_64.sha256
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [build, build-linux-gnu, build-darwin-x64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      # A missing asset means every user of that platform gets a 404 on first
      # run, which is indistinguishable from "the tool does nothing".
      - name: Verify every published asset is present
        run: |
          missing=0
          targets="linux-x86_64 linux-aarch64 linux-x86_64-gnu linux-aarch64-gnu darwin-aarch64 darwin-x86_64"
          for target in $targets; do
            for asset in "xmlfmt-$target" "xmlfmt-$target.sha256"; do
              if [ ! -f "dist/$asset" ]; then
                echo "error: dist/$asset is missing" >&2
                missing=1
              fi
            done
          done
          exit $missing

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true