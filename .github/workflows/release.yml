name: release

# Builds `xmlfmt` for every supported target and attaches the binaries to a
# GitHub Release. The npm package in `npmjs/` downloads these assets.
#
#   git tag v0.1.4 && git push origin v0.1.4

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are linked fully statically against musl, so they
          # run on any distribution regardless of its glibc version. A glibc
          # build would pick up the runner's glibc symbol versions and refuse
          # to start on older systems (e.g. `GLIBC_2.33' not found`).
          - runner: ubuntu-latest
            target: linux-x86_64
            musl: true
          # GitHub's arm64 Linux runners are only available to public
          # repositories; drop this entry (and the MB target support for it)
          # if that is a problem.
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            musl: true
          - runner: macos-15
            target: darwin-aarch64
            musl: false
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install musl toolchain (static Linux builds)
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # The MoonBit runtime's arm64 simdutf.o is compiled against glibc
      # headers and references `__memcpy_chk`; musl provides no `*_chk`
      # fortify symbols, so link a small shim supplying them.
      - name: Build fortify shim (glibc *_chk for musl)
        if: matrix.musl
        run: |
          mkdir -p /tmp/xmlfmt-cc
          cat > /tmp/xmlfmt-cc/fortify_shim.c <<'EOF'
          #include <string.h>
          #include <stdarg.h>
          #include <stdio.h>
          void *__memcpy_chk(void *d, const void *s, size_t n, size_t dn) { (void)dn; return memcpy(d, s, n); }
          void *__memmove_chk(void *d, const void *s, size_t n, size_t dn) { (void)dn; return memmove(d, s, n); }
          void *__memset_chk(void *d, int c, size_t n, size_t dn) { (void)dn; return memset(d, c, n); }
          char *__strcpy_chk(char *d, const char *s, size_t dn) { (void)dn; return strcpy(d, s); }
          char *__stpcpy_chk(char *d, const char *s, size_t dn) { (void)dn; return stpcpy(d, s); }
          char *__strcat_chk(char *d, const char *s, size_t dn) { (void)dn; return strcat(d, s); }
          char *__strncpy_chk(char *d, const char *s, size_t n, size_t dn) { (void)dn; return strncpy(d, s, n); }
          char *__strncat_chk(char *d, const char *s, size_t n, size_t dn) { (void)dn; return strncat(d, s, n); }
          int __sprintf_chk(char *s, int flag, size_t slen, const char *fmt, ...) { (void)flag; (void)slen; va_list ap; va_start(ap, fmt); int r = vsprintf(s, fmt, ap); va_end(ap); return r; }
          int __vsprintf_chk(char *s, int flag, size_t slen, const char *fmt, va_list ap) { (void)flag; (void)slen; return vsprintf(s, fmt, ap); }
          int __snprintf_chk(char *s, size_t n, int flag, size_t slen, const char *fmt, ...) { (void)flag; (void)slen; va_list ap; va_start(ap, fmt); int r = vsnprintf(s, n, fmt, ap); va_end(ap); return r; }
          int __vsnprintf_chk(char *s, size_t n, int flag, size_t slen, const char *fmt, va_list ap) { (void)flag; (void)slen; return vsnprintf(s, n, fmt, ap); }
          int __printf_chk(int flag, const char *fmt, ...) { (void)flag; va_list ap; va_start(ap, fmt); int r = vprintf(fmt, ap); va_end(ap); return r; }
          int __vprintf_chk(int flag, const char *fmt, va_list ap) { (void)flag; return vprintf(fmt, ap); }
          int __fprintf_chk(FILE *f, int flag, const char *fmt, ...) { (void)flag; va_list ap; va_start(ap, fmt); int r = vfprintf(f, fmt, ap); va_end(ap); return r; }
          int __vfprintf_chk(FILE *f, int flag, const char *fmt, va_list ap) { (void)flag; return vfprintf(f, fmt, ap); }
          EOF
          musl-gcc -O2 -c /tmp/xmlfmt-cc/fortify_shim.c -o /tmp/xmlfmt-cc/fortify_shim.o
          ar rcs /tmp/xmlfmt-cc/libmbfortify.a /tmp/xmlfmt-cc/fortify_shim.o

      - name: moon version
        run: moon version

      # A fresh runner has an empty registry index, so dependencies
      # (moonbitlang/x, bobzhang/zip, ...) cannot be resolved until the index
      # is fetched.
      - name: Update registry index
        run: moon update

      # MOON_CC drives both the compile and the link step. The wrapper adds
      # `-static`, and `moon` looks for `ar` next to the compiler driver, so
      # the wrapper directory gets a symlink to the system `ar`. Link
      # invocations also get the fortify shim; compile invocations (`-c`) are
      # passed through untouched.
      - name: Prepare Linux headers for musl
        if: matrix.musl
        run: |
          rm -rf /tmp/linux-headers
          mkdir -p /tmp/linux-headers
          ln -s /usr/include/linux /tmp/linux-headers/linux
          case "$(uname -m)" in
            x86_64) asm_dir=/usr/include/x86_64-linux-gnu/asm ;;
            aarch64) asm_dir=/usr/include/aarch64-linux-gnu/asm ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          ln -s "$asm_dir" /tmp/linux-headers/asm
          ln -s /usr/include/asm-generic /tmp/linux-headers/asm-generic

      - name: Build (static musl, release)
        if: matrix.musl
        run: |
          cat > /tmp/xmlfmt-cc/xmlfmt-musl-gcc <<'EOF'
          #!/bin/sh
          for arg in "$@"; do
            if [ "$arg" = "-c" ]; then
              exec musl-gcc -D_GNU_SOURCE -include limits.h -I/tmp/linux-headers "$@"
            fi
          done
          exec musl-gcc "$@" -static -L/tmp/xmlfmt-cc -lmbfortify
          EOF
          chmod +x /tmp/xmlfmt-cc/xmlfmt-musl-gcc
          ln -sf "$(command -v ar)" /tmp/xmlfmt-cc/ar
          MOON_CC=/tmp/xmlfmt-cc/xmlfmt-musl-gcc MOON_AR=ar moon build --target native --release

      - name: Build (release)
        if: ${{ !matrix.musl }}
        run: moon build --target native --release

      - name: Stage binary
        run: |
          mkdir -p dist
          cp _build/native/release/build/cmd/xmlfmt/xmlfmt.exe "dist/xmlfmt-${{ matrix.target }}"
          chmod +x "dist/xmlfmt-${{ matrix.target }}"
          file "dist/xmlfmt-${{ matrix.target }}" || true
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "xmlfmt-${{ matrix.target }}" > "xmlfmt-${{ matrix.target }}.sha256")
          else
            (cd dist && shasum -a 256 "xmlfmt-${{ matrix.target }}" > "xmlfmt-${{ matrix.target }}.sha256")
          fi

      # Sanity check: Linux assets must be fully static or they would carry a
      # glibc version requirement and fail on older distributions.
      - name: Verify Linux binary is statically linked
        if: matrix.musl
        run: |
          file "dist/xmlfmt-${{ matrix.target }}"
          if ! file "dist/xmlfmt-${{ matrix.target }}" | grep -q "statically linked"; then
            echo "error: xmlfmt-${{ matrix.target }} is not statically linked" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: xmlfmt-${{ matrix.target }}
          path: |
            dist/xmlfmt-${{ matrix.target }}
            dist/xmlfmt-${{ matrix.target }}.sha256
          if-no-files-found: error

  build-darwin-x64:
    name: build darwin-x64 (zig-cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: moon version
        run: moon version

      # A fresh runner has an empty registry index, so dependencies
      # (moonbitlang/x, ...) cannot be resolved until the index is fetched.
      - name: Prepare macOS headers shim for zig
        run: |
          rm -rf /tmp/macos-headers
          mkdir -p /tmp/macos-headers/sys
          cat > /tmp/macos-headers/sys/vnode.h <<'EOF'
          #ifndef _SYS_VNODE_H
          #define _SYS_VNODE_H
          enum vtype { VNON, VREG, VDIR, VBLK, VCHR, VLNK, VSOCK, VFIFO, VBAD, VSTR, VCPLX };
          #endif
          EOF

      - name: Update registry index
        run: moon update

      - name: Build (darwin-x64, via zig-cross)
        env:
          C_INCLUDE_PATH: /tmp/macos-headers
        run: |
          moonx moonrockz/zig-cross@0.1.2 build darwin-x64

      - name: Stage binary
        run: |
          mkdir -p dist
          cp _build/cross/darwin-x64/native/release/build/cmd/xmlfmt/xmlfmt.exe "dist/xmlfmt-darwin-x86_64"
          chmod +x "dist/xmlfmt-darwin-x86_64"
          file "dist/xmlfmt-darwin-x86_64" || true
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "xmlfmt-darwin-x86_64" > "xmlfmt-darwin-x86_64.sha256")
          else
            (cd dist && shasum -a 256 "xmlfmt-darwin-x86_64" > "xmlfmt-darwin-x86_64.sha256")
          fi

      - name: Verify macOS x64 binary header
        run: |
          python3 - "dist/xmlfmt-darwin-x86_64" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()[:16]
          if data[:4] != b"\xcf\xfa\xed\xfe":
              raise SystemExit(f"expected Mach-O magic, found {data[:4]!r}")
          (cputype,) = struct.unpack_from("<I", data, 4)
          if cputype != 16777223:
              raise SystemExit(f"expected Mach-O cputype 16777223, found {cputype}")
          print(f"OK darwin-x64: Mach-O cputype {cputype}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xmlfmt-darwin-x86_64
          path: |
            dist/xmlfmt-darwin-x86_64
            dist/xmlfmt-darwin-x86_64.sha256
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [build, build-darwin-x64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true